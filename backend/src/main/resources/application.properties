spring.application.name=risk-aware-simulator
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/simulator}
spring.datasource.username=${DB_USER:simulator}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.jwt-secret=${JWT_SECRET}
server.error.include-message=never
server.error.include-stacktrace=never
market.mode=${MARKET_MODE:LIVE}
market.provider=${MARKET_PROVIDER:AUTO}
market.max-age-seconds=${MARKET_MAX_AGE_SECONDS:20}
