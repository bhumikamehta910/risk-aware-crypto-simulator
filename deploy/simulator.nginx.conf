# Include in the http context. Replace simulator.example throughout and install
# the certificate before testing with nginx -t. This host directly faces clients.
limit_req_zone $binary_remote_addr zone=auth_by_ip:1m rate=10r/m;
limit_req_zone $server_name zone=auth_by_host:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=api_by_ip:2m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=feeds_by_ip:1m;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name simulator.example;
    return 308 https://simulator.example$request_uri;
}

server {
    listen 443 ssl;
    server_name simulator.example;
    if ($host != simulator.example) { return 444; }
    ssl_certificate /etc/letsencrypt/live/simulator.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simulator.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/simulator/dist;
    client_max_body_size 16k;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host simulator.example;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host simulator.example;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://simulator.example; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/auth/ {
        limit_req zone=auth_by_ip burst=4 nodelay;
        limit_req zone=auth_by_host burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/ {
        limit_req zone=api_by_ip burst=25 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /ws/prices {
        limit_conn feeds_by_ip 16;
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
