services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: simulator
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting Compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - simulator-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulator -d simulator"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  simulator-data: {}
